services:
  app:
    build: .
    container_name: elmanasa
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      NODE_ENV: production
      PORT: 4000
      DATA_DIR: /data
      UPLOAD_DIR: /data/uploads
      MAX_FILE_MB: ${MAX_FILE_MB:-20}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-}
      APP_SECRET: ${APP_SECRET:?ضع APP_SECRET في ملف .env بجانب docker-compose.yml}
    volumes:
      - elmanasa_data:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:4000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  elmanasa_data:
